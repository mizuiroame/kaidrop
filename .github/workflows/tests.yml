name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the dependencies
        run: python -m pip install -r requirements-dev.txt

      # CI=true (set by GitHub) skips the GUI tests in tests/test_selection.py.
      # The settings tests point APPDATA at a temporary folder.
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
